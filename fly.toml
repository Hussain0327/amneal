app = "amneal"
primary_region = "iad"

[build]
  [build.args]
    INSTALL_LOCAL_EMBEDDINGS = "false"

[env]
  EMBEDDING_PROVIDER = "openai"
  AUTH_COOKIE_SECURE = "true"
  API_HOST = "0.0.0.0"
  API_PORT = "8000"
  CORS_ALLOW_ORIGINS_CSV = "https://amneal.vercel.app"
  SENTRY_ENVIRONMENT = "production"
  # B1: refuse to boot on the SQLite fallback. DATABASE_URL is a Fly secret
  # (`fly secrets set DATABASE_URL=...`); if it is missing the app must fail
  # loudly, not silently run on ephemeral disk and lose the audit trail.
  REQUIRE_DATABASE_URL = "true"
  # B4: SENTRY_DSN is a Fly secret (`fly secrets set SENTRY_DSN=...`). Without
  # it the app boots but logs a loud warning — errors would otherwise vanish.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
