app = "amneal"
primary_region = "iad"

[build]
  [build.args]
    INSTALL_LOCAL_EMBEDDINGS = "false"
    # Prod never runs Dagster (uvicorn-only CMD; the GitHub Actions cron is the
    # sole scheduler), so keep its closure out of the shipped image.
    INSTALL_ORCHESTRATION = "false"

# Run pending Alembic migrations in a one-off machine BEFORE the rolling deploy
# of the app machines. This moves the live schema to the build's head so the
# app's boot guard (store/db.py::_init_postgres) passes instead of crash-looping
# — the 2026-06-18 incident, where deploying a 0009 image against a 0008 DB took
# prod down. The entrypoint skips its own init-db for the `alembic` command (see
# docker/entrypoint.sh) so this isn't blocked by that same guard. DATABASE_URL +
# secrets are injected into the release machine automatically.
# Assumes an already-bootstrapped/stamped DB (incremental upgrade); a fresh empty
# Postgres is still bootstrapped by init-db's create_all+stamp path, not here.
[deploy]
  release_command = "alembic upgrade head"

[env]
  EMBEDDING_PROVIDER = "openai"
  AUTH_COOKIE_SECURE = "true"
  API_HOST = "0.0.0.0"
  API_PORT = "8000"
  CORS_ALLOW_ORIGINS_CSV = "https://amneal.vercel.app"
  SENTRY_ENVIRONMENT = "production"
  # The app only ever serves behind Fly's edge ([http_service] + force_https), so
  # trust the proxy: _client_ip then keys the per-IP login limiter on the
  # platform-attested Fly-Client-IP (un-spoofable, set by Fly's edge) instead of
  # collapsing every request to request.client.host (= the Fly proxy in prod),
  # which would merge all callers into one IP bucket and gut the spray guard.
  TRUST_PROXY_HEADERS = "true"
  # B1: refuse to boot on the SQLite fallback. DATABASE_URL is a Fly secret
  # (`fly secrets set DATABASE_URL=...`); if it is missing the app must fail
  # loudly, not silently run on ephemeral disk and lose the audit trail.
  REQUIRE_DATABASE_URL = "true"
  # B4: SENTRY_DSN is a Fly secret (`fly secrets set SENTRY_DSN=...`). Without
  # it the app boots but logs a loud warning — errors would otherwise vanish.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  # CD-2: keep TWO machines running so a rolling deploy (the default strategy)
  # always leaves one machine serving while the other is replaced — instead of
  # stopping the single machine and booting a new one with NOTHING serving
  # during the grace+init window. Requires `fly scale count 2` once; this floor
  # only stops Fly from autostopping below it. The /health check below gates
  # each machine back into rotation before the next is touched.
  min_machines_running = 2

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
