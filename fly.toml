app = "amneal"
primary_region = "iad"
# Fly sends SIGTERM, then SIGKILL after kill_timeout (default 5s). This is a
# ceiling after the signal, not a fixed delay: a process that exits promptly
# (uvicorn does) is unaffected. Keep 30s so in-flight requests -- live SSE
# streams included -- can drain on deploys, and so the phase-3 Go proxy
# (20s SIGTERM drain, go/internal/proxy/proxy.go shutdownGrace; see
# docs/GO_PROXY_ROLLOUT.md) needs no fly.toml change when it lands. Plain
# integer seconds -- the one timeout in fly.toml documented WITHOUT a unit
# suffix.
kill_timeout = 30

[build]
  [build.args]
    INSTALL_LOCAL_EMBEDDINGS = "false"
    # Prod never runs Dagster (uvicorn-only app group; the GitHub Actions cron
    # is the sole scheduler), so keep its closure out of the shipped image.
    INSTALL_ORCHESTRATION = "false"

# Run pending Alembic migrations in a one-off machine BEFORE the rolling deploy
# of the app machines. This moves the live schema to the build's head so the
# app's boot guard (store/db.py::_init_postgres) passes instead of crash-looping
# -- the 2026-06-18 incident, where deploying a 0009 image against a 0008 DB took
# prod down. The entrypoint skips its own init-db for the `alembic` command (see
# docker/entrypoint.sh) so this isn't blocked by that same guard. DATABASE_URL +
# secrets are injected into the release machine automatically.
# Assumes an already-bootstrapped/stamped DB (incremental upgrade); a fresh empty
# Postgres is still bootstrapped by init-db's create_all+stamp path, not here.
[deploy]
  release_command = "alembic upgrade head"

# ONE process group: uvicorn holds the public port -- the exact topology that
# served v28-v33. The 2026-07-15 one-deploy traffic flip to the Go proxy
# (PR #93 -> deploy #106) structurally deadlocked and was un-flipped by this
# change; the flip re-lands as phases 2-3 of docs/GO_PROXY_ROLLOUT.md. The
# explicit command pins the group name "app" (Fly's default group name, so the
# existing machines stay mapped to it) and mirrors the image CMD byte-for-byte.
#
# DO NOT change the bind to "::" as a flip prerequisite. Single-process
# uvicorn serves via loop.create_server, and asyncio/uvloop force
# IPV6_V6ONLY=1 on that path (uvicorn's dual-stack bind_socket() runs only
# under --reload/--workers>1), so "--host ::" is IPv6-ONLY. It would refuse
# flyd's IPv4 health-check dials and Fly Proxy's private-IPv4 backhaul
# ("Fly Proxy reaches services through a private IPv4 address on each VM" --
# Fly docs), wedging the rolling deploy with a machine out of rotation.
# Verified empirically on the pinned uvicorn 0.51.0 + uvloop 0.22.1
# (2026-07-15; runbook root cause 2). The dual-stack listener the flip needs
# is the runbook's phase-2 work, not a --host flag.
[processes]
  app = "uvicorn regwatch.api.main:app --host 0.0.0.0 --port 8000"

[env]
  EMBEDDING_PROVIDER = "openai"
  AUTH_COOKIE_SECURE = "true"
  API_HOST = "0.0.0.0"
  API_PORT = "8000"
  CORS_ALLOW_ORIGINS_CSV = "https://amneal.vercel.app"
  SENTRY_ENVIRONMENT = "production"
  # The app only ever serves behind Fly's edge ([http_service] + force_https),
  # so trust the proxy: _client_ip then keys the per-IP login limiter on the
  # platform-attested Fly-Client-IP (un-spoofable, set by Fly's edge) instead
  # of collapsing every request to request.client.host (= the Fly proxy in
  # prod), which would merge all callers into one IP bucket and gut the spray
  # guard. The phase-3 Go proxy forwards these headers byte-for-byte
  # (go/internal/proxy tests cover it), so this setting survives the flip.
  TRUST_PROXY_HEADERS = "true"
  # B1: refuse to boot on the SQLite fallback. DATABASE_URL is a Fly secret
  # (`fly secrets set DATABASE_URL=...`); if it is missing the app must fail
  # loudly, not silently run on ephemeral disk and lose the audit trail.
  REQUIRE_DATABASE_URL = "true"
  # B4: SENTRY_DSN is a Fly secret (`fly secrets set SENTRY_DSN=...`). Without
  # it the app boots but logs a loud warning -- errors would otherwise vanish.
  #
  # Staged for the phase-3 traffic flip (docs/GO_PROXY_ROLLOUT.md) and read
  # ONLY by the Go proxy's ConfigFromEnv (go/internal/proxy/proxy.go:43) --
  # nothing in the Python app reads it, so it rides along inert on app
  # machines ([env] is app-wide on Fly). The 6PN name resolves AAAA/IPv6-only
  # to RUNNING app-group machines with no health filtering, which is exactly
  # why the flip is gated on the phase-2 dual-stack listener. The proxy
  # listens on its PORT default 8080, which must match internal_port once
  # [http_service] fronts the proxy group.
  UPSTREAM_URL = "http://app.process.amneal.internal:8000"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  # CD-2: keep TWO machines running so a rolling deploy (the default strategy)
  # always leaves one machine serving while the other is replaced -- instead of
  # stopping the single machine and booting a new one with NOTHING serving
  # during the grace+init window. This is a floor against autostop, not a
  # creator. The /health check below gates each machine back into rotation
  # before the next is touched.
  min_machines_running = 2

  # GET /health dials uvicorn directly while the app group holds the edge.
  # After the phase-3 flip this same check becomes END-TO-END through the
  # proxy (edge -> proxy -> 6PN -> uvicorn -> DB) so a proxy with a dead
  # upstream falls out of rotation instead of serving 502s "healthily";
  # /healthz stays a proxy-local liveness debug endpoint only.
  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
