[project]
name = "regwatch"
version = "0.1.0"
description = "A regulatory prep accelerator for a generic-drug Clinical Regulatory Affairs team."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amneal Engineering" }]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "tenacity>=9.0",
    "pdfplumber>=0.11",
    "pypdf>=6.13.3",  # 6.13.3 fixes GHSA-jm82-fx9c-mx94 (unbounded stream-length DoS)
    "chromadb>=0.5.20",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "rapidfuzz>=3.10",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
    "tiktoken>=0.8",
    "bcrypt>=5.0.0",
    "python-docx>=1.2.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "sentry-sdk[fastapi]>=2.62.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.3",
    "torch>=2.4,<3",
    "transformers<5",
]
llm = [
    "openai>=1.55",
    "anthropic>=0.40",
]
orchestration = [
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dagster-postgres>=0.29,<0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "types-requests",
    "respx>=0.21",
    "import-linter>=2.0",
]

[project.scripts]
regwatch = "regwatch.cli:app"

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regwatch", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff
]
ignore = ["E501", "B008"]  # E501: line length handled by black; B008: typer.Option in defaults

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # intentional sys.path bootstrap before imports

[tool.black]
line-length = 100
target-version = ["py311"]

# Layering fitness functions (ARCH-4). These guard two real seams so the
# coupling can't silently regress; they catch DIRECT imports only
# (allow_indirect_imports) because both targets are reachable transitively
# through legitimate callers. Keep this set to contracts that PASS on the
# current tree — a strict layered contract is intentionally NOT shipped because
# domain modules import regwatch.store.db directly today.
[tool.importlinter]
root_package = "regwatch"
# Required so the `openai` forbidden contract below can see the external SDK as
# a graph node (otherwise its ignore_imports exceptions don't resolve).
include_external_packages = "true"

# The pgvector implementation is meant to sit behind the store facade
# (store.vector_store / store.db). The two api.main / store.db edges that remain
# are the startup embedding-dim assertion (assert_embedding_provider_dim), which
# must run before any vector I/O — they are pinned here so new direct callers
# of the raw implementation are rejected.
[[tool.importlinter.contracts]]
name = "pgvector_store is only reached through the store facade"
type = "forbidden"
source_modules = ["regwatch"]
forbidden_modules = ["regwatch.store.pgvector_store"]
allow_indirect_imports = "true"
ignore_imports = [
    "regwatch.store.vector_store -> regwatch.store.pgvector_store",
    "regwatch.store.db -> regwatch.store.pgvector_store",
    "regwatch.api.main -> regwatch.store.pgvector_store",
]

# The OpenAI SDK is an I/O detail. It belongs in the two LLM client seams; the
# api.main edge is only the APIError type used to classify upstream failures.
# Any other module reaching for `openai` directly is a layering smell.
[[tool.importlinter.contracts]]
name = "openai SDK stays in the LLM client seam"
type = "forbidden"
source_modules = ["regwatch"]
forbidden_modules = ["openai"]
allow_indirect_imports = "true"
ignore_imports = [
    "regwatch.common.llm_clients -> openai",
    "regwatch.generate.llm -> openai",
    "regwatch.api.main -> openai",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["regwatch"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
# Pragmatic for a POC: don't fail on third-party gaps
disallow_untyped_decorators = false

# python-docx ships only partial type hints (e.g. add_page_break is untyped),
# which trips strict no-untyped-call. Treat it as stubless so docx objects are
# Any at the call site, matching the ignore_missing_imports posture above.
[[tool.mypy.overrides]]
module = ["docx.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "test_alerts",
    "test_api",
    "test_cross_drug_leak",
    "test_extractor",
    "test_grounded_qa_citations",
    "test_invariants",
    "test_llm_provider",
    "test_pipeline_idempotent",
]
disallow_any_generics = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
# Fail a hung test fast instead of stalling CI to its 6h ceiling (e.g. a DB
# lock-wait — the Jun-18 incident class — or a missed network monkeypatch
# against the CI Postgres service). thread, not signal: SIGALRM is unreliable
# inside native extensions (pdfminer, psycopg). Per-test override via
# @pytest.mark.timeout(N) if a specific test legitimately needs longer.
timeout = 60
timeout_method = "thread"
markers = [
    "integration: integration tests (may hit the network)",
    "slow: slow tests",
    "invariants: compliance invariants (INV-1..INV-6)",
]
