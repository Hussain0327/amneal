[project]
name = "regwatch"
version = "0.1.0"
description = "A regulatory prep accelerator for a generic-drug Clinical Regulatory Affairs team."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amneal Engineering" }]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "tenacity>=9.0",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "chromadb>=0.5.20",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "rapidfuzz>=3.10",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
    "tiktoken>=0.8",
    "bcrypt>=5.0.0",
    "python-docx>=1.2.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "sentry-sdk[fastapi]>=2.62.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.3",
    "torch>=2.4,<3",
    "transformers<5",
]
llm = [
    "openai>=1.55",
    "anthropic>=0.40",
]
orchestration = [
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dagster-postgres>=0.29,<0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "types-requests",
    "respx>=0.21",
]

[project.scripts]
regwatch = "regwatch.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regwatch", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff
]
ignore = ["E501", "B008"]  # E501: line length handled by black; B008: typer.Option in defaults

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # intentional sys.path bootstrap before imports

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["regwatch"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
# Pragmatic for a POC: don't fail on third-party gaps
disallow_untyped_decorators = false

# python-docx ships only partial type hints (e.g. add_page_break is untyped),
# which trips strict no-untyped-call. Treat it as stubless so docx objects are
# Any at the call site, matching the ignore_missing_imports posture above.
[[tool.mypy.overrides]]
module = ["docx.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "test_alerts",
    "test_api",
    "test_cross_drug_leak",
    "test_extractor",
    "test_grounded_qa_citations",
    "test_invariants",
    "test_llm_provider",
    "test_pipeline_idempotent",
]
disallow_any_generics = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: integration tests (may hit the network)",
    "slow: slow tests",
    "invariants: compliance invariants (INV-1..INV-6)",
]
