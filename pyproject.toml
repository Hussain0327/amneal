[project]
name = "regwatch"
version = "0.1.0"
description = "A regulatory prep accelerator for a generic-drug Clinical Regulatory Affairs team."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amneal Engineering" }]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "tenacity>=9.0",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "sentence-transformers>=3.3",
    "chromadb>=0.5.20",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "rapidfuzz>=3.10",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
llm = [
    "openai>=1.55",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "types-requests",
    "respx>=0.21",
]

[project.scripts]
regwatch = "regwatch.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regwatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff
]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["regwatch"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
# Pragmatic for a POC: don't fail on third-party gaps
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: integration tests (may hit the network)",
    "slow: slow tests",
    "invariants: compliance invariants (INV-1..INV-6)",
]
