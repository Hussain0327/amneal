# INSTALL_LOCAL_EMBEDDINGS still defaults to true here (NOT in the Dockerfile,
# where the slim no-torch image stays the default) so offline/eval tooling that
# wants sentence-transformers has it. The APP default is EMBEDDING_PROVIDER=
# openai below -- since R5 the pgvector chunk table is 1536-dim and refuses
# 384-dim local-bge-small at boot. Set INSTALL_LOCAL_EMBEDDINGS=false for a
# slim build.
x-regwatch-build: &regwatch-build
  context: .
  args:
    INSTALL_LOCAL_EMBEDDINGS: ${INSTALL_LOCAL_EMBEDDINGS:-true}

x-regwatch-environment: &regwatch-environment
  DATA_DIR: /app/data
  RAW_PDF_DIR: /app/data/raw
  PROCESSED_DIR: /app/data/processed
  # CRA White Paper Word template. Lives under the mounted ./data volume, so
  # dropping the official .docx at ./data/templates/cra_white_paper_template.docx
  # enables real-template fill; absent it the docx writer falls back to a
  # structurally-equivalent document with a visible "(generated without the
  # official CRA template file)" marker. The template is gitignored (internal).
  WHITEPAPER_TEMPLATE_PATH: /app/data/templates/cra_white_paper_template.docx
  # Postgres-only since R5: defaults to the compose `db` service (pgvector
  # image, same as CI). To run against the hosted database instead, point at the
  # Databricks Lakebase DIRECT endpoint URL with ?sslmode=require. Never a
  # `-pooler` host: docs/DEPLOY.md treats that as a release gate.
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
  # Postgres-only means the chunk table is vector(1536), so the provider must
  # be 1536-dim: openai (set OPENAI_API_KEY in .env). local-bge-small is
  # 384-dim and the K6 dim assert refuses it at boot -- it remains available
  # only for offline/eval tooling, not the app datastore.
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}

services:
  db:
    # Same image family as CI's service container: Postgres 17 + pgvector.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: *regwatch-build
    image: ${REGWATCH_IMAGE:-regwatch:local}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *regwatch-environment
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    # Same argv as the image CMD and fly.toml [processes].app, so local dev
    # exercises the real dual-stack listener instead of a uvicorn command prod
    # no longer runs (docs/GO_PROXY_ROLLOUT.md phase 2).
    command: ["regwatch", "serve"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./regwatch/frontend
    image: ${REGWATCH_WEB_IMAGE:-regwatch-web:local}
    environment:
      API_PROXY_TARGET: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./regwatch/frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy

  ingest:
    profiles: ["ingest"]
    image: ${REGWATCH_IMAGE:-regwatch:local}
    build: *regwatch-build
    env_file:
      - path: .env
        required: false
    environment:
      <<: *regwatch-environment
    volumes:
      - ./data:/app/data
    command: ["regwatch", "seed"]
    # init-db (the entrypoint) hard-requires Postgres since R5, and
    # `docker compose run` only auto-starts declared dependencies -- without
    # this a standalone ingest run on a fresh checkout has no db to reach.
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  web-node-modules:
