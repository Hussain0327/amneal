# Automated dependency updates. Once merged, Dependabot starts opening update
# PRs on the weekly schedule below — review and merge them like any other PR.
#
# Four ecosystems mirror what CI actually builds (.github/workflows/ci.yml):
#   - uv:             root pyproject.toml + uv.lock (backend deps). The `uv`
#                     ecosystem updates BOTH pyproject and the lockfile, so the
#                     CI `uv export --frozen` check stays green (a `pip`-ecosystem
#                     bump would leave uv.lock stale and fail --frozen).
#   - npm:            regwatch/frontend (Next.js app)
#   - gomod:          go/go.mod + go.sum (the proxy binary on the public edge)
#   - github-actions: the action pins used by the workflows in this repo
#
# Minor/patch bumps are grouped into one PR per ecosystem to cut review churn;
# majors stay separate so breaking changes get their own scrutiny.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /regwatch/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Owner decision 2026-07-08 (reaffirmed 2026-07-22): the app stays on
    # React 18. Comment-level "@dependabot ignore this major version" cannot
    # express majors-only on grouped multi-dependency PRs, so the ignore lives
    # here instead: majors for the React 4-pack are suppressed while 18.x
    # minor/patch updates keep flowing.
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # go/go.sum is a single lockfile, so ungrouped bumps land as mutually
    # conflicting PRs (same failure mode the uv.lock batches hit). Group the
    # minor/patch flow into one PR; majors stay separate for their own review.
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
