name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # B8: exercise the production datastore (Postgres + pgvector) in CI — the
      # mode prod actually runs in. Without this, test_pgvector_store.py and
      # test_postgres_bootstrap.py skip and the prod path ships untested.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        run: uv python install ${{ matrix.python-version }}

      - name: sync deps
        run: uv sync --extra dev --extra llm --extra local-embeddings --extra orchestration

      - name: ruff
        run: uv run ruff check src tests migrations

      - name: black --check
        run: uv run black --check src tests migrations

      - name: mypy
        run: uv run mypy src tests

      - name: lint-imports
        run: uv run lint-imports

      - name: pytest
        # --cov-fail-under is a regression floor: measured coverage was ~82%, so
        # 80 leaves headroom while still failing CI if coverage silently erodes.
        run: uv run pytest -q --cov=src/regwatch --cov-fail-under=80

      - name: seed vector store
        if: env.OPENAI_API_KEY != ''
        run: uv run regwatch seed

      - name: eval
        if: env.OPENAI_API_KEY != ''
        run: uv run python -m regwatch.eval.run_eval --check-thresholds

      - name: eval skipped
        if: env.OPENAI_API_KEY == ''
        run: echo "Skipping live eval because OPENAI_API_KEY is not configured; pytest runs the deterministic eval gate."

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      # Audit the SHIPPED production closure: the slim image installs llm +
      # orchestration (Dockerfile default INSTALL_LOCAL_EMBEDDINGS=false; Fly runs
      # EMBEDDING_PROVIDER=openai), so torch/transformers from `local-embeddings`
      # never reach prod and are intentionally out of scope here — gating prod CI
      # on that heavyweight ML extra's noisy, slow-to-fix CVE cadence would add
      # churn with no prod exposure. --frozen also asserts uv.lock matches pyproject.
      - name: export runtime dependency set
        run: >-
          uv export --frozen --no-emit-project --no-dev
          --extra llm --extra orchestration
          --format requirements-txt --output-file requirements-audit.txt

      # chromadb GHSA-f4j7-r4q5-qw2c (CVE-2026-45829, ChromaToast) is a pre-auth
      # RCE in the standalone Chroma HTTP *server*; REGWATCH uses the embedded
      # PersistentClient (and pgvector in prod), so the vulnerable path is never
      # reachable. No upstream fix is published (last_affected 1.5.9) — remove
      # this ignore the moment one ships. Both ids are listed because pip-audit
      # keys the advisory by its GHSA id (PyPI/OSV source), not the CVE alias.
      - name: pip-audit (python deps)
        run: >-
          uvx pip-audit -r requirements-audit.txt
          --ignore-vuln GHSA-f4j7-r4q5-qw2c --ignore-vuln CVE-2026-45829

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: docker build
        run: docker build -t regwatch:ci .

      - name: compose config
        run: docker compose config --quiet

      - name: frontend docker build
        run: docker build -t regwatch-web:ci regwatch/frontend

      # Container image scan: FIXABLE CRITICAL/HIGH vulns (--ignore-unfixed:
      # base-image OS packages routinely carry CVEs with no released fix, and
      # failing on those would just pin the build to a moving target with no
      # action to take) PLUS any embedded secrets (--scanners vuln,secret —
      # secret findings ignore --ignore-unfixed and gate the build the same way).
      # Trivy caches its DB across runs.
      - name: trivy scan (API image)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/.trivyignore:/root/.trivyignore" \
            aquasec/trivy:latest image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile /root/.trivyignore \
            --scanners vuln,secret regwatch:ci

      - name: trivy scan (web image)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/.trivyignore:/root/.trivyignore" \
            aquasec/trivy:latest image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile /root/.trivyignore \
            --scanners vuln,secret regwatch-web:ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: regwatch/frontend/package-lock.json

      - name: install frontend deps
        working-directory: regwatch/frontend
        run: npm ci

      # Supply-chain gate on what actually ships: production deps only
      # (--omit=dev), failing on high/critical advisories. Dev-only build-tool
      # advisories don't reach the served app and shouldn't block the build.
      - name: npm audit (production deps)
        working-directory: regwatch/frontend
        run: npm audit --omit=dev --audit-level=high

      - name: frontend lint
        working-directory: regwatch/frontend
        run: npm run lint

      - name: frontend typecheck
        working-directory: regwatch/frontend
        run: npx tsc --noEmit

      - name: frontend build
        working-directory: regwatch/frontend
        run: npm run build

  # The /query-family wire types in lib/api.ts are generated from the FastAPI
  # schema (lib/api-types.ts). Regenerate here and fail if the committed copy is
  # stale, so the frontend contract can never silently drift from the backend.
  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        run: uv python install 3.12

      - name: sync deps (api importable for the schema dump)
        run: uv sync --extra dev --extra llm --extra orchestration

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: regwatch/frontend/package-lock.json

      - name: install frontend deps
        working-directory: regwatch/frontend
        run: npm ci

      - name: regenerate wire types from the FastAPI schema
        working-directory: regwatch/frontend
        run: npm run gen:types

      - name: fail if committed api-types.ts is stale
        run: git diff --exit-code -- regwatch/frontend/lib/api-types.ts
