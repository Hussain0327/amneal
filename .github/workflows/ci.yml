name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        run: uv python install 3.12

      - name: sync deps
        run: uv sync --extra dev

      - name: ruff
        run: uv run ruff check src tests

      - name: black --check
        run: uv run black --check src tests

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q
