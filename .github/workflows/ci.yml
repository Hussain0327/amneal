name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        run: uv python install ${{ matrix.python-version }}

      - name: sync deps
        run: uv sync --extra dev --extra llm --extra local-embeddings

      - name: ruff
        run: uv run ruff check src tests migrations

      - name: black --check
        run: uv run black --check src tests migrations

      - name: mypy
        run: uv run mypy src tests

      - name: pytest
        run: uv run pytest -q

      - name: seed vector store
        if: env.OPENAI_API_KEY != ''
        run: uv run regwatch seed

      - name: eval
        if: env.OPENAI_API_KEY != ''
        run: uv run python -m regwatch.eval.run_eval --check-thresholds

      - name: eval skipped
        if: env.OPENAI_API_KEY == ''
        run: echo "Skipping live eval because OPENAI_API_KEY is not configured; pytest runs the deterministic eval gate."

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: docker build
        run: docker build -t regwatch:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: regwatch/frontend/package-lock.json

      - name: install frontend deps
        working-directory: regwatch/frontend
        run: npm ci

      - name: frontend lint
        working-directory: regwatch/frontend
        run: npm run lint

      - name: frontend build
        working-directory: regwatch/frontend
        run: npm run build
