name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded in-flight run when a newer commit lands on the same ref,
# so iterative pushes don't burn Actions minutes finishing runs whose result is
# already moot (the dominant waste). Grouped per-ref, so each branch/PR cancels
# only its own prior run; the deploy workflow still fires only on the latest
# successful main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # B8: exercise the production datastore (Postgres + pgvector) in CI — the
      # mode prod actually runs in. Without this, test_pgvector_store.py and
      # test_postgres_bootstrap.py skip and the prod path ships untested.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        # Prod runs only on 3.12 (Dockerfile python:3.12-slim), so gate on 3.12
        # alone -- the 3.11 leg doubled this (the heaviest) job's minutes. Re-add
        # "3.11" here if this ever needs to stay verified as a 3.11 library.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        run: uv python install ${{ matrix.python-version }}

      - name: sync deps
        run: uv sync --extra dev --extra llm --extra local-embeddings

      - name: ruff
        run: uv run ruff check src tests migrations

      - name: black --check
        run: uv run black --check src tests migrations

      # Persist mypy's incremental cache between runs (cold mypy is ~60s, warm
      # ~15s). Keyed per Python version and per dependency/config hash so a real
      # type-surface change starts fresh; the rolling run_id + restore-keys always
      # restores the latest compatible cache, and mypy re-checks changed files
      # regardless, so a stale cache cannot produce a wrong result.
      - name: cache mypy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
            mypy-${{ matrix.python-version }}-

      - name: mypy
        run: uv run mypy src tests

      - name: lint-imports
        run: uv run lint-imports

      - name: pytest
        # --cov-fail-under is a regression floor: measured coverage was ~82%, so
        # 80 leaves headroom while still failing CI if coverage silently erodes.
        run: uv run pytest -q --cov=src/regwatch --cov-fail-under=80

      - name: seed vector store
        if: env.OPENAI_API_KEY != ''
        run: uv run regwatch seed

      - name: eval
        if: env.OPENAI_API_KEY != ''
        run: uv run python -m regwatch.eval.run_eval --check-thresholds

      - name: eval skipped
        if: env.OPENAI_API_KEY == ''
        run: echo "Skipping live eval because OPENAI_API_KEY is not configured; pytest runs the deterministic eval gate."

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "latest"
          enable-cache: true

      # Audit the SHIPPED production closure: the slim image installs llm only
      # (Dockerfile defaults INSTALL_LOCAL_EMBEDDINGS=false; Fly runs
      # EMBEDDING_PROVIDER=openai), so torch/transformers from
      # `local-embeddings` never reach prod and are intentionally out of scope
      # here: gating prod CI on their noisy, slow-to-fix CVE cadence would add
      # churn with no prod exposure. --frozen also asserts uv.lock matches
      # pyproject.
      - name: export runtime dependency set
        run: >-
          uv export --frozen --no-emit-project --no-dev
          --extra llm
          --format requirements-txt --output-file requirements-audit.txt

      - name: pip-audit (python deps)
        run: uvx pip-audit -r requirements-audit.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # Buildx (docker-container driver) is required for the GitHub Actions layer
      # cache backend (cache-from/to type=gha) used by the image builds below.
      - name: set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # load:true exports the built image into the local docker daemon so the
      # Trivy steps below scan it exactly as before. Separate cache scopes keep
      # the API and web images from evicting each other; mode=max caches the
      # intermediate dependency-install layer (the dominant build cost). The
      # default build args are unchanged (slim image, INSTALL_LOCAL_EMBEDDINGS
      # false) -- this is purely a build-cache change, not a content change.
      - name: docker build (API image)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          load: true
          tags: regwatch:ci
          cache-from: type=gha,scope=api
          # ignore-error: a GHA cache export failure (e.g. "failed to reserve
          # cache" under quota pressure) must NOT fail the build -- the cache is
          # an optimization, not a gate.
          cache-to: type=gha,mode=max,scope=api,ignore-error=true

      - name: compose config
        run: docker compose config --quiet

      - name: frontend docker build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: regwatch/frontend
          load: true
          tags: regwatch-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true

      # With buildx the image bytes exist THREE times by scan time: the
      # builder's local store (mode=max keeps every stage's layers even after
      # the GHA cache export completes), the daemon store (load: true), and the
      # copy Trivy writes to its container /tmp while exporting the image from
      # the daemon. On 2026-07-20 that third copy hit "no space left on device"
      # (runs 29751451276 / 29751461848) and failed the gate -- the plain
      # `docker build` layout never had the buildkit copy, which is why the
      # same scans were green for months before the cache re-land. The local
      # buildkit store is expendable here (its useful content is already in the
      # GHA cache; nothing builds after this point), so drop it before
      # scanning; that puts peak disk BELOW the old plain-build layout. df
      # lines are observability for the next disk incident.
      - name: reclaim buildkit disk before scans
        run: |
          df -h /
          docker buildx prune -af > /dev/null
          df -h /

      # Persist Trivy's vuln DB (~100MB) across ephemeral runners (the scans
      # below mount ~/.cache/trivy). The rolling key writes a fresh copy each run
      # and restores the most recent one, so the cached DB is at most one run
      # stale; Trivy still refreshes it when its own metadata says it is past TTL.
      - name: cache trivy DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      # Container image scan: FIXABLE CRITICAL/HIGH vulns (--ignore-unfixed:
      # base-image OS packages routinely carry CVEs with no released fix, and
      # failing on those would just pin the build to a moving target with no
      # action to take) PLUS any embedded secrets (--scanners vuln,secret —
      # secret findings ignore --ignore-unfixed and gate the build the same way).
      # Trivy caches its DB across runs. The tag is PINNED (0.72.0, current
      # 2026-07-20) for the same reason deploy.yml pins flyctl: an unpinned
      # `latest` makes scanner-behavior drift land silently on whatever PR
      # happens to run next. The vuln DB stays fresh regardless -- it is
      # fetched at scan time, not baked into the image tag. Bump deliberately.
      - name: trivy scan (API image)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/.trivyignore:/root/.trivyignore" \
            aquasec/trivy:0.72.0 image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile /root/.trivyignore \
            --scanners vuln,secret regwatch:ci

      - name: trivy scan (web image)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$GITHUB_WORKSPACE/.trivyignore:/root/.trivyignore" \
            aquasec/trivy:0.72.0 image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile /root/.trivyignore \
            --scanners vuln,secret regwatch-web:ci

      # Trivy runs as root in the container and writes ~/.cache/trivy with
      # root-owned 0700 dirs, which the actions/cache POST-save (tar, as the
      # runner user) cannot read -- so without this the save silently fails and
      # the DB never persists. Hand the tree back to the runner. NOTE the
      # post-save itself only runs when the JOB succeeds (actions/cache v4.3.0
      # post-if: success()), so a failed run does not refresh the cache -- the
      # next green run does; always() just keeps this handoff unconditional.
      - name: hand trivy cache to the runner (for actions/cache save)
        if: always()
        run: |
          if [ -d "$HOME/.cache/trivy" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/trivy"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: regwatch/frontend/package-lock.json

      - name: install frontend deps
        working-directory: regwatch/frontend
        run: npm ci

      # Supply-chain gate on what actually ships: production deps only
      # (--omit=dev), failing on high/critical advisories. Dev-only build-tool
      # advisories don't reach the served app and shouldn't block the build.
      - name: npm audit (production deps)
        working-directory: regwatch/frontend
        run: npm audit --omit=dev --audit-level=high

      - name: frontend lint
        working-directory: regwatch/frontend
        run: npm run lint

      - name: frontend typecheck
        working-directory: regwatch/frontend
        run: npx tsc --noEmit

      - name: frontend build
        working-directory: regwatch/frontend
        run: npm run build

      # Run the vitest suites so green CI actually means the frontend tests
      # pass. The "test" script is `vitest run` (non-watch), safe for CI; deps
      # were installed by `npm ci` above.
      - name: frontend test
        working-directory: regwatch/frontend
        run: npm test

  # The wire types in lib/api.ts are generated from the FastAPI schema
  # (lib/api-types.ts), and regwatch/frontend/openapi.json is the committed
  # contract snapshot. Regenerate both here and fail if either committed copy
  # is stale, so the frontend contract can never silently drift from the
  # backend in either direction (tests/test_openapi_contract.py is the
  # matching pytest-side guard).
  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        run: uv python install 3.12

      - name: sync deps (api importable for the schema dump)
        run: uv sync --extra dev --extra llm

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: regwatch/frontend/package-lock.json

      - name: install frontend deps
        working-directory: regwatch/frontend
        run: npm ci

      - name: regenerate wire types from the FastAPI schema
        working-directory: regwatch/frontend
        run: npm run gen:types

      # ls-files first: an untracked snapshot or types file would make the
      # diff below pass vacuously while the committed contract silently
      # ceased to exist.
      - name: fail if committed openapi.json or api-types.ts is stale
        run: |
          git ls-files --error-unmatch regwatch/frontend/openapi.json regwatch/frontend/lib/api-types.ts
          git diff --exit-code -- regwatch/frontend/openapi.json regwatch/frontend/lib/api-types.ts

  # Strangler Step 3 lane (docs/POLYGLOT_TARGET_2026-07-10.md): the Go reverse
  # proxy under go/ ships inert -- no deploy config runs it yet (rollout plan
  # in docs/GO_PROXY_ROLLOUT.md) -- but its gate lives here from day one.
  go-proxy:
    runs-on: ubuntu-latest
    env:
      # The Go store's opt-in tests and sqlc vet's db-prepare rule target this
      # disposable service DB -- same B8 rationale as lint-type-test: the Go
      # data layer must be exercised against the datastore prod actually runs.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # gofmt exits 0 even when files need formatting; -l prints offenders,
      # so fail on any output (this lane's `black --check`).
      - name: gofmt
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: setup sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6  # v5.0.0
        with:
          sqlc-version: "1.31.1"

      # Stale-generated-code gate: the committed *.sql.go must equal what sqlc
      # generates from the committed schema + queries. Hermetic by design --
      # sqlc.yaml disables the DB-backed analyzer, so this needs no database.
      - name: sqlc diff
        working-directory: go
        run: sqlc diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          working-directory: go

      # db-prepare PREPAREs every query against a real Postgres carrying the
      # committed snapshot: a query that references a column the schema does
      # not have fails HERE, not at runtime. Load the snapshot first (psql
      # ships on the runner). Ordering is load-bearing: go test drops and
      # recreates schema public itself, so vet must run before it.
      - name: sqlc vet (db-prepare)
        working-directory: go
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f internal/store/schema.sql
          sqlc vet

      - name: go test
        working-directory: go
        run: go test ./...

  # Proves the committed Go store schema snapshot (go/internal/store/schema.sql)
  # still equals what Alembic head actually produces: bootstrap a throwaway
  # pgvector database the canonical way (regwatch init-db = create_all + stamp,
  # the only supported fresh-PG path), re-run the EXACT generation pipeline,
  # and diff against the committed file. A failure means a Python migration
  # changed a step-4 table without regenerating the Go side -- the two halves
  # of the polyglot split can never silently disagree about the schema.
  store-schema-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "latest"
          enable-cache: true

      # EMBEDDING_PROVIDER=openai satisfies the vector-dimension assert with
      # no API key (same trick as tests/test_postgres_bootstrap.py).
      - name: bootstrap schema at alembic head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          EMBEDDING_PROVIDER: openai
        run: uv run regwatch init-db

      # pg_dump must come from the same pg17 lineage as the service (the
      # runner's own client refuses newer servers), so run it from the
      # already-pinned service image; --network host reaches the published
      # port. No new version pin is introduced here.
      - name: regenerate + diff the snapshot
        run: |
          PGDUMP="docker run --rm --network host -e PGPASSWORD=postgres pgvector/pgvector:pg17 pg_dump" \
            bash scripts/gen-store-schema.sh \
            'postgresql://postgres:postgres@localhost:5432/postgres' /tmp/schema.live.sql
          if ! diff -u go/internal/store/schema.sql /tmp/schema.live.sql; then
            echo "::error::go/internal/store/schema.sql is stale: a migration changed a step-4 table. Regenerate with scripts/gen-store-schema.sh against a fresh init-db database, run 'sqlc generate', and commit both." >&2
            exit 1
          fi
