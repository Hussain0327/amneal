# The ONE live Databricks eval lane (slm-layer F15). Two entry points, one
# shared concurrency group:
#
#   - workflow_call from ci.yml: the blocking PR/main eval, prose=false.
#   - workflow_dispatch: the dark v6 arm (prose=true by default), run by hand
#     to produce a recorded scorecard before a checkpoint.
#
# The non-canceling "databricks-eval" group serializes every live eval against
# the shared Databricks workspace: concurrent evals collide on workspace QPS
# and trip the transport gate (a green eval used to also mean "nobody else was
# running one"), and before the split a dispatch-triggered eval would have
# joined ci-${ref} and CANCELED in-flight PR CI. Called runs take the group at
# the caller job (ci.yml); the workflow-level group below governs dispatch
# runs. Same group name either way, so the mutual exclusion spans both.
name: databricks-eval

on:
  workflow_call:
    inputs:
      prose:
        description: run the eval with REGWATCH_PROSE_SYNTHESIS=1 (the v6 prose arm)
        type: boolean
        default: false
        required: false
      selective:
        description: >-
          run the eval with REGWATCH_SELECTIVE_CITATION=1 (the v7 selective-citation
          arm; requires prose)
        type: boolean
        default: false
        required: false
      require_databricks_arm:
        description: >-
          fail unless the run resolves the Databricks/Qwen arm. Default TRUE for
          the blocking call: the OpenAI-1536 fallback measures the ROLLBACK
          geometry, and letting it stand in silently is the same silent-green
          defect as skipping the eval outright.
        type: boolean
        default: true
        required: false
      assert_prod_mode:
        description: >-
          pass --assert-prod-mode, which refuses to score a run whose answer-path
          settings disagree with config/prod_mode.json. Default FALSE on the
          blocking call ONLY until ci.yml flips to prose+selective; turning it on
          before that flip would fail every merge by design.
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      prose:
        description: run the eval with REGWATCH_PROSE_SYNTHESIS=1 (the v6 prose arm)
        type: boolean
        default: true
        required: false
      selective:
        description: >-
          run the eval with REGWATCH_SELECTIVE_CITATION=1 (the v7 selective-citation
          arm; requires prose)
        type: boolean
        default: false
        required: false
      require_databricks_arm:
        description: >-
          fail unless the run resolves the Databricks/Qwen arm. Default FALSE on
          dispatch so the OpenAI-1536 arm stays hand-runnable for a rollback
          comparison, which is the one job it is still honest for.
        type: boolean
        default: false
        required: false
      assert_prod_mode:
        description: >-
          pass --assert-prod-mode. Default FALSE on dispatch: the v6 arm and the
          OpenAI rollback arm are legitimate DIAGNOSTICS that deliberately do
          not match production, and defaulting this on would make them
          unrunnable. Turn it on for a run whose scorecard is meant to speak for
          production -- the v7 measurement before the ci.yml flip.
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: databricks-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      # Only what the "resolve live eval arm" step needs to decide whether the
      # arm is available. Every one of these is a string where empty means "not
      # configured", so an absent secret cannot change behavior. The typed
      # provider settings (model names, dimension) are declared on the eval
      # steps that use them -- an empty value at job scope once broke pydantic
      # import (see the _blank_env_falls_back_to_default validator).
      QWEN_EMBEDDING_BASE_URL: ${{ secrets.QWEN_EMBEDDING_BASE_URL }}
      QWEN_EMBEDDING_TOKEN: ${{ secrets.QWEN_EMBEDDING_TOKEN }}
      # A repo VARIABLE, not a secret, and deliberately stable: it is part of
      # the embedding-profile fingerprint, so a per-run value would mint a new
      # profile id every build and break the eval_run trend line.
      DATABRICKS_SERVING_RUNTIME_VERSION: ${{ vars.DATABRICKS_SERVING_RUNTIME_VERSION }}
      # The v6 prose arm. Empty means OFF (the settings validator reads a blank
      # env as unset); "1" flips synthesis to the prose+markers chain, which is
      # the whole point of the dark dispatch run.
      REGWATCH_PROSE_SYNTHESIS: ${{ inputs.prose && '1' || '' }}
      # The v7 selective-citation POLICY, on top of v6's FORMAT. Empty means
      # OFF, same convention as the prose flag above. Inert without prose (the
      # guard step below refuses a selective-without-prose dispatch rather
      # than silently running v5).
      REGWATCH_SELECTIVE_CITATION: ${{ inputs.selective && '1' || '' }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        run: uv python install 3.12

      - name: sync deps
        run: uv sync --extra dev --extra llm

      - name: guard selective requires prose
        if: ${{ inputs.selective && !inputs.prose }}
        run: |
          echo "::error::selective requires prose (v7 is a prose prompt); refusing to burn a live eval slot"
          exit 1

      # Live eval. One arm since the OpenAI provider removal (2026-08-17):
      # production embeds queries with Databricks-hosted Qwen3, and that is the
      # only geometry worth gating on. REFUSAL_SCORE_THRESHOLD's behavior on
      # real embeddings is gated NOWHERE else -- tests/test_eval_gate.py runs
      # on hash-based echo embeddings with the threshold pinned to 0.0.
      - name: resolve live eval arm
        id: eval_arm
        run: |
          if [ -n "$QWEN_EMBEDDING_BASE_URL" ] && [ -n "$QWEN_EMBEDDING_TOKEN" ] \
             && [ -n "$DATABRICKS_SERVING_RUNTIME_VERSION" ]; then
            echo "arm=databricks" >> "$GITHUB_OUTPUT"
          else
            echo "arm=none" >> "$GITHUB_OUTPUT"
          fi

      # The blocking call must measure the arm production serves. Without this,
      # a lapsed Databricks credential silently demotes the gate to the
      # OpenAI-1536 ROLLBACK space and it still reports green -- a scorecard
      # about geometry nobody ships. Checked before any seed/index/embed work so
      # a misconfigured run costs nothing and frees the serialized eval slot.
      - name: require the arm production serves
        if: >-
          ${{ inputs.require_databricks_arm
              && steps.eval_arm.outputs.arm != 'databricks' }}
        env:
          RESOLVED_ARM: ${{ steps.eval_arm.outputs.arm }}
        run: |
          echo "::error::This eval must measure the Databricks/Qwen arm, but"
          echo "::error::resolved arm='${RESOLVED_ARM}'. The OpenAI-1536 arm is the"
          echo "::error::rollback space, not what production serves."
          exit 1

      # Register FIRST, then seed with the arm active: ingest writes the profile
      # vectors inline (_profile_document_embeddings) and leaves the legacy
      # 1536-dim column NULL, so this arm needs no backfill pass and no OpenAI
      # key at all. Registration is content-addressed, so it is idempotent.
      - name: prepare databricks eval arm
        if: steps.eval_arm.outputs.arm == 'databricks'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # Both feed the profile fingerprint. Left unset, settings' committed
          # defaults apply; an empty value is treated as unset, not as "".
          QWEN_EMBEDDING_MODEL: ${{ vars.QWEN_EMBEDDING_MODEL }}
          QWEN_EMBEDDING_DIMENSION: ${{ vars.QWEN_EMBEDDING_DIMENSION }}
        run: |
          set -euo pipefail
          PROFILE_ID=$(uv run regwatch embedding-profile-register \
            --serving-runtime-version "$DATABRICKS_SERVING_RUNTIME_VERSION" --id-only)
          echo "EVAL_PROFILE_ID=$PROFILE_ID" >> "$GITHUB_ENV"

      # Index BEFORE seed, not after. `regwatch seed` runs with the profile
      # ACTIVE, so its init_db() calls assert_profile_ready_for_activation,
      # which demands a valid HNSW index. Seeding first is therefore circular:
      # the index the assert wants would not exist until the step after the one
      # that needs it. Building it against an empty chunk_embedding is legal --
      # coverage is 0/0, which counts as complete, and pgvector maintains an
      # HNSW index on insert -- so ordering it here satisfies both this step's
      # own assert and the seed step's. run_eval also refuses an arm without a
      # ready index, so this is a gate prerequisite either way.
      - name: index databricks eval arm
        if: steps.eval_arm.outputs.arm == 'databricks'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run regwatch embedding-profile-index "$EVAL_PROFILE_ID"

      - name: seed vector store (databricks arm)
        if: steps.eval_arm.outputs.arm == 'databricks'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          EMBEDDING_PROVIDER: qwen3
          QWEN_EMBEDDING_MODEL: ${{ vars.QWEN_EMBEDDING_MODEL }}
          QWEN_EMBEDDING_DIMENSION: ${{ vars.QWEN_EMBEDDING_DIMENSION }}
        # ACTIVE_EMBEDDING_PROFILE is exported here rather than in the `env:`
        # block above because EVAL_PROFILE_ID is produced by a previous step via
        # $GITHUB_ENV; exporting it in the shell keeps the dependency obvious.
        run: |
          set -euo pipefail
          export ACTIVE_EMBEDDING_PROFILE="$EVAL_PROFILE_ID"
          uv run regwatch seed

      - name: eval (databricks arm)
        if: steps.eval_arm.outputs.arm == 'databricks'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          EMBEDDING_PROVIDER: qwen3
          QWEN_EMBEDDING_MODEL: ${{ vars.QWEN_EMBEDDING_MODEL }}
          QWEN_EMBEDDING_DIMENSION: ${{ vars.QWEN_EMBEDDING_DIMENSION }}
          LLM_PROVIDER: databricks
          DATABRICKS_LLM_BASE_URL: ${{ secrets.DATABRICKS_LLM_BASE_URL }}
          DATABRICKS_LLM_TOKEN: ${{ secrets.DATABRICKS_LLM_TOKEN }}
          DATABRICKS_LLM_MODEL: ${{ vars.DATABRICKS_LLM_MODEL }}
        run: |
          uv run python -m regwatch.eval.run_eval \
            --profile "$EVAL_PROFILE_ID" --check-thresholds --out eval-scorecard.json \
            ${{ inputs.assert_prod_mode && '--assert-prod-mode' || '' }}

      # The scorecard is also written to the eval_run ledger, but that lands in
      # the CI Postgres service container, which is destroyed with the job. The
      # artifact is what survives for a human comparing two runs; the dark v6
      # and v7 arms upload under their own names so a Checkpoint packet can
      # cite them.
      - name: upload eval scorecard
        if: always() && steps.eval_arm.outputs.arm != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.selective && 'dark-eval-scorecard-v7' || (inputs.prose && 'dark-eval-scorecard' || 'eval-scorecard') }}
          path: eval-scorecard.json
          if-no-files-found: ignore

      # Was a ::warning:: and a green job. That made "the eval could not run at
      # all" indistinguishable from "the eval ran and passed" on the PR page --
      # the gate reported success for a measurement that never happened. An
      # absent credential is an operator error, so it fails like one.
      - name: eval could not run
        if: steps.eval_arm.outputs.arm == 'none'
        run: |
          echo "::error::Live eval could not run - no provider credentials configured."
          echo "Configure QWEN_EMBEDDING_BASE_URL + QWEN_EMBEDDING_TOKEN +"
          echo "DATABRICKS_SERVING_RUNTIME_VERSION for the Databricks arm (the"
          echo "geometry production serves; the OpenAI rollback arm was removed)."
          echo "pytest's offline eval gate does NOT exercise real embedding geometry"
          echo "or the refusal threshold, so it cannot stand in for this."
          exit 1
