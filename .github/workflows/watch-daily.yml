name: watch-daily

# Scheduled production run of `regwatch watch` (the daily FDA PSG crawl →
# watchlist match → ingest → alert → digest pipeline). There is NO Dagster
# daemon deployed (compose.yaml's scheduler is local-only), so this GitHub
# Actions cron is the sole driver of the daily pipeline in production.
#
# It connects to the SAME live Supabase Postgres the API uses, over the public
# pooler endpoint, and writes durable alerts to the DB (stream 1).
#
# It does NOT migrate the schema. The Fly deploy is the single migration authority
# (fly.toml `[deploy] release_command = "alembic upgrade head"` runs migrations in
# a one-off machine before the rolling deploy). The Postgres init path
# (src/regwatch/store/db.py::_init_postgres) REFUSES to start when the DB stamp !=
# the code's head, so if a migration was merged but not yet deployed this cron
# fails loudly here rather than advancing the live schema ahead of the running API
# machines — which would crash-loop them (the 2026-06-18 failure class).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   WATCH_DATABASE_URL  postgresql://...pooler.supabase.com:5432/postgres?sslmode=require
#                       (the prod Supabase URL WITH ?sslmode=require — see stream 2)
#   OPENAI_API_KEY      ingest embeds every chunk and EMBEDDING_PROVIDER=openai,
#                       so this is REQUIRED (no key => the run hard-fails).
#   OPENFDA_API_KEY     OPTIONAL — only raises the openFDA rate limit; the run
#                       works without it. Leave unset to omit.
# While WATCH_DATABASE_URL is unset, the job skips cleanly (no failures).
#
# Optional alerting secrets (this cron is the SOLE prod driver of the pipeline,
# so a silent failure leaves analysts on stale FDA guidance with nobody paged):
#   SLACK_WEBHOOK_URL     OPTIONAL — Slack incoming-webhook URL. When set, a
#                         failed run posts repo/workflow/run-URL to Slack. Unset
#                         => the notify step is a graceful no-op (forks are fine).
#   WATCH_HEALTHCHECK_URL OPTIONAL — healthchecks.io-style ping URL (see
#                         docs/DEPLOY.md §6.2). On success we ping it; on failure
#                         we ping `$URL/fail`. This is the dead-man's-switch that
#                         catches a cron that NEVER STARTS (which the in-job
#                         failure step cannot). Unset => both pings no-op.

on:
  schedule:
    # 07:17 UTC daily — off the top of the hour to avoid the cron stampede, and
    # early enough that a US-East analyst sees fresh alerts at the start of day.
    - cron: "17 7 * * *"
  workflow_dispatch:

# Never overlap runs against the shared prod DB; let an in-flight run finish
# rather than cancelling it mid-ingest.
concurrency:
  group: watch-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Mirror prod (fly.toml): OpenAI embeddings + Postgres-mode boot guard.
      DATABASE_URL: ${{ secrets.WATCH_DATABASE_URL }}
      REQUIRE_DATABASE_URL: "true"
      EMBEDDING_PROVIDER: "openai"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      # entrypoint.sh runs init-db on boot; here we run alembic + watch directly,
      # so this is informational parity with the container only.
      SENTRY_ENVIRONMENT: "production"
      # Optional alerting (see header). Mapped to env so `if:` can test presence
      # and the notify steps no-op cleanly when the secret is absent.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      WATCH_HEALTHCHECK_URL: ${{ secrets.WATCH_HEALTHCHECK_URL }}
    steps:
      - name: skipped (secret not configured)
        if: env.DATABASE_URL == ''
        run: |
          echo "WATCH_DATABASE_URL secret not set — skipping the daily watch run."
          echo "Set it to the prod Supabase URL with ?sslmode=require (stream 2)."

      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
        with:
          persist-credentials: false

      - name: install uv
        if: env.DATABASE_URL != ''
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        if: env.DATABASE_URL != ''
        run: uv python install 3.12

      # Match the SHIPPED prod closure (ci.yml python-audit): llm + orchestration.
      # local-embeddings is intentionally omitted — prod runs EMBEDDING_PROVIDER=openai.
      - name: sync deps
        if: env.DATABASE_URL != ''
        run: uv sync --extra llm --extra orchestration

      # NOTE: no `alembic upgrade head` here — the Fly deploy migrates (see the
      # header). `regwatch watch` boots through the _init_postgres stamp guard,
      # which refuses (loudly) if the DB schema is behind this checkout's head;
      # the fix is to deploy the pending migration, not to migrate from the cron.

      # The pipeline: crawl → match watchlist → ingest matches → write durable
      # alerts → digest. --extract is the default (paid per-PSG BE extraction);
      # pass --no-extract here if you want change-detection + alerts without the
      # LLM extraction cost (chunks are still embedded either way).
      - name: regwatch watch
        if: env.DATABASE_URL != ''
        run: uv run regwatch watch

      # ---- Refusal-threshold revalidation (ADVISORY observability) -----------
      # NON-GATING. This re-runs the gold set through the REAL prod retrieval path
      # in THIS job's PROD embedding space (EMBEDDING_PROVIDER=openai + the live
      # Supabase DATABASE_URL => OpenAI-1536 + pgvector), which CI structurally
      # cannot exercise (CI runs bge-384 + Chroma). It reports the two score
      # distributions (must-answer vs must-refuse) and RECOMMENDS a refusal cutoff
      # so a human can revalidate the provisional 0.30 default in the post-bge
      # OpenAI vector space. See docs/DEPLOY.md §"Refusal-threshold revalidation".
      #
      # It is calibration OBSERVABILITY, NOT a gate: the sweep is read-only w.r.t.
      # the safety path — it never changes REFUSAL_SCORE_THRESHOLD or the 0.30
      # default, and exits 0 even when its recommendation differs from 0.30. The
      # explicit `continue-on-error: true` guarantees that a sweep hiccup (or a
      # recommendation != 0.30) can NEVER fail the daily crawl or block ingestion,
      # and that it never trips the failure-alerting / dead-man's-switch steps
      # below (a non-gating step's failure does not set job `failure()`).
      - name: threshold sweep (advisory)
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: uv run python -m regwatch.eval.threshold_sweep --out threshold_sweep.json

      - name: upload threshold sweep artifact
        if: env.DATABASE_URL != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: threshold-sweep
          path: threshold_sweep.json
          if-no-files-found: warn

      # ---- Failure alerting + dead-man's-switch (see header) -----------------
      # This cron is the sole prod driver of the pipeline; a silent failure is
      # the failure class we guard against here. Each step is gated on BOTH the
      # job outcome AND secret-presence, so a contributor/fork without the
      # secrets sees no extra steps and no errors.

      # Post to Slack on any failure. RUN_URL etc. are trusted GitHub context
      # (no user input) but are passed via env and quoted per the safe pattern.
      - name: notify slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 --retry 2 --retry-delay 10 \
            -X POST -H 'Content-Type: application/json' \
            --data "$(printf '{"text":":rotating_light: *%s* / *%s* FAILED — analysts may be on stale FDA guidance. <%s|View run>"}' "$REPO" "$WORKFLOW" "$RUN_URL")" \
            "$SLACK_WEBHOOK_URL"

      # Dead-man's-switch success ping. Fires even on a clean skip (DB secret
      # unset) — the cron DID start and finish, which is what we monitor. A cron
      # that never starts pings nothing, so healthchecks.io pages on the miss.
      - name: healthcheck ping on success
        if: success() && env.WATCH_HEALTHCHECK_URL != ''
        run: curl -fsS --max-time 20 --retry 2 --retry-delay 10 "$WATCH_HEALTHCHECK_URL"

      # Signal the failure to healthchecks.io too, so it surfaces alongside the
      # missed-start case in one place. Best-effort: `|| true` so a flaky ping
      # never masks the real failure that already failed the job.
      - name: healthcheck ping on failure
        if: failure() && env.WATCH_HEALTHCHECK_URL != ''
        run: curl -fsS --max-time 20 --retry 2 --retry-delay 10 "${WATCH_HEALTHCHECK_URL}/fail" || true
