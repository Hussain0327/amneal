name: watch-daily

# Scheduled production run of `regwatch watch` (the daily FDA PSG crawl →
# watchlist match → ingest → alert → digest pipeline). There is NO Dagster
# daemon deployed (compose.yaml's scheduler is local-only), so this GitHub
# Actions cron is the sole driver of the daily pipeline in production.
#
# It connects to the SAME live Supabase Postgres the API uses, over the public
# pooler endpoint, and writes durable alerts to the DB (stream 1).
#
# It does NOT migrate the schema. The Fly deploy is the single migration authority
# (fly.toml `[deploy] release_command = "alembic upgrade head"` runs migrations in
# a one-off machine before the rolling deploy). The Postgres init path
# (src/regwatch/store/db.py::_init_postgres) REFUSES to start when the DB stamp !=
# the code's head, so if a migration was merged but not yet deployed this cron
# fails loudly here rather than advancing the live schema ahead of the running API
# machines — which would crash-loop them (the 2026-06-18 failure class).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   WATCH_DATABASE_URL  postgresql://...pooler.supabase.com:5432/postgres?sslmode=require
#                       (the prod Supabase URL WITH ?sslmode=require — see stream 2)
#   OPENAI_API_KEY      ingest embeds every chunk and EMBEDDING_PROVIDER=openai,
#                       so this is REQUIRED (no key => the run hard-fails).
#   OPENFDA_API_KEY     OPTIONAL — only raises the openFDA rate limit; the run
#                       works without it. Leave unset to omit.
# While WATCH_DATABASE_URL is unset, the job skips cleanly (no failures).

on:
  schedule:
    # 07:17 UTC daily — off the top of the hour to avoid the cron stampede, and
    # early enough that a US-East analyst sees fresh alerts at the start of day.
    - cron: "17 7 * * *"
  workflow_dispatch:

# Never overlap runs against the shared prod DB; let an in-flight run finish
# rather than cancelling it mid-ingest.
concurrency:
  group: watch-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Mirror prod (fly.toml): OpenAI embeddings + Postgres-mode boot guard.
      DATABASE_URL: ${{ secrets.WATCH_DATABASE_URL }}
      REQUIRE_DATABASE_URL: "true"
      EMBEDDING_PROVIDER: "openai"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      # entrypoint.sh runs init-db on boot; here we run alembic + watch directly,
      # so this is informational parity with the container only.
      SENTRY_ENVIRONMENT: "production"
    steps:
      - name: skipped (secret not configured)
        if: env.DATABASE_URL == ''
        run: |
          echo "WATCH_DATABASE_URL secret not set — skipping the daily watch run."
          echo "Set it to the prod Supabase URL with ?sslmode=require (stream 2)."

      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
        with:
          persist-credentials: false

      - name: install uv
        if: env.DATABASE_URL != ''
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: install python
        if: env.DATABASE_URL != ''
        run: uv python install 3.12

      # Match the SHIPPED prod closure (ci.yml python-audit): llm + orchestration.
      # local-embeddings is intentionally omitted — prod runs EMBEDDING_PROVIDER=openai.
      - name: sync deps
        if: env.DATABASE_URL != ''
        run: uv sync --extra llm --extra orchestration

      # NOTE: no `alembic upgrade head` here — the Fly deploy migrates (see the
      # header). `regwatch watch` boots through the _init_postgres stamp guard,
      # which refuses (loudly) if the DB schema is behind this checkout's head;
      # the fix is to deploy the pending migration, not to migrate from the cron.

      # The pipeline: crawl → match watchlist → ingest matches → write durable
      # alerts → digest. --extract is the default (paid per-PSG BE extraction);
      # pass --no-extract here if you want change-detection + alerts without the
      # LLM extraction cost (chunks are still embedded either way).
      - name: regwatch watch
        if: env.DATABASE_URL != ''
        run: uv run regwatch watch
