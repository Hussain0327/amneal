# Amneal brand theme.
# Golden-yellow brush-script wordmark on a clean, professional surface.
[theme]
base = "light"
primaryColor = "#F5B400"            # Amneal gold — buttons, focus, accents
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF8E6" # warm sand tint for sidebar / cards
textColor = "#16213A"               # deep ink navy
linkColor = "#B5810A"               # darkened gold for readable links
borderColor = "#F0E2BC"
baseRadius = "0.6rem"
font = "sans serif"
headingFont = "sans serif"
